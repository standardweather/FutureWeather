name: FutureWeather maps

on:
  # GFS 0.25° output through F168 is usually on AWS about 4h20m after each cycle, NBM and the 48-hour
  # HRRR well before that. These times leave some margin; if a run isn't finished yet, each model
  # falls back to its previous complete cycle.
  schedule:
    - cron: "50 4,10,16,22 * * *"
  push:
    branches: [main]
  workflow_dispatch:   # "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # One job per model, side by side. A failed model is left out of the page rather than blocking the rest.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        model: [gfs, ecmwf, nbm, hrrr]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # make_plots.py stops starting new hours after FW_BUDGET_MIN and rewrites its run file after every
      # hour, so a slow or stalled download (the ECMWF bucket does this now and then) still publishes the
      # hours that finished. The step limit stops a stall inside one hour without cancelling the job.
      - id: plots
        run: python -u make_plots.py ${{ matrix.model }}
        timeout-minutes: 24
        continue-on-error: true
        env:
          FW_BUDGET_MIN: "20"
      # Keep each good run, so a model with nothing new this time shows its last run instead of vanishing.
      - if: hashFiles(format('site/models/{0}.json', matrix.model)) != ''
        uses: actions/cache/save@v4
        with:
          key: fw-${{ matrix.model }}-${{ github.run_id }}
          path: |
            site/img/${{ matrix.model }}
            site/models/${{ matrix.model }}.json
      - if: hashFiles(format('site/models/{0}.json', matrix.model)) == ''
        uses: actions/cache/restore@v4
        with:
          key: fw-${{ matrix.model }}-${{ github.run_id }}
          restore-keys: fw-${{ matrix.model }}-
          path: |
            site/img/${{ matrix.model }}
            site/models/${{ matrix.model }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: model-${{ matrix.model }}
          path: |
            site/img/${{ matrix.model }}
            site/models/${{ matrix.model }}.json
          retention-days: 1
          if-no-files-found: ignore
      # Still mark the job failed when the model didn't finish, so it shows in the Actions tab.
      - if: steps.plots.outcome != 'success'
        run: exit 1

  # The GEFS ensemble for the Confidence view: 31 members, packed into small binary tiles.
  ensemble:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python make_ensemble.py
      - uses: actions/upload-artifact@v4
        with:
          name: ensemble
          path: site/ens
          retention-days: 1

  # Data for AIRMETcast (the experimental, unlisted page at /AviationWeather/airmetcast/): AIRMET- and
  # convective SIGMET-style areas worked out from raw GFS and HRRR output by make_airmetcast.py.
  airmetcast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        model: [gfs, hrrr]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python make_airmetcast.py ${{ matrix.model }}
      - uses: actions/upload-artifact@v4
        with:
          name: airmetcast-${{ matrix.model }}
          path: site/airmetcast/data
          retention-days: 1

  deploy:
    needs: [build, ensemble, airmetcast]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: model-*
          path: site
          merge-multiple: true
      # A failed ensemble job leaves the Confidence view saying it isn't published yet; the maps still deploy.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ensemble
          path: site/ens
      # A failed AIRMETcast job leaves that page saying nothing has been made yet.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: airmetcast-*
          path: site/airmetcast/data
          merge-multiple: true
      - run: python3 merge_runs.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # deploy-pages sometimes can't see the github-pages artifact the moment it's uploaded ("No artifacts
      # named github-pages were found") and the whole cycle's maps go unpublished. It fails before creating
      # a deployment, so wait and try once more.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
