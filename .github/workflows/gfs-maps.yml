name: FutureWeather maps

on:
  # GFS 0.25° output through F072 is usually on AWS about 4 hours after each
  # cycle. These times leave some margin; if a run isn't finished yet, the
  # script falls back to the previous complete cycle.
  schedule:
    - cron: "40 4,10,16,22 * * *"
  workflow_dispatch:   # "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Cartopy downloads coastline/state shapefiles on first use; keep them.
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/cartopy
          key: cartopy-naturalearth-v1

      - run: python make_plots.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
